name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          pip install -q pdfplumber python-docx playwright pytest pypdf pillow
          python -m playwright install --with-deps chromium
          pytest -q -rs tests/
