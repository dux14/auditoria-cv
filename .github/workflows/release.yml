name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          pip install -q python-docx pytest
          pytest -q tests/
      - name: Build .skill (para claude.ai)
        run: |
          mkdir -p dist
          (cd skills && zip -qr "../dist/auditoria-cv-${GITHUB_REF_NAME}.skill" auditoria-cv)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/auditoria-cv-${GITHUB_REF_NAME}.skill" \
            --title "$GITHUB_REF_NAME" --generate-notes
