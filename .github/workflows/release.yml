name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .skill
        run: |
          mkdir -p dist/auditoria-cv
          cp -R SKILL.md assets references scripts dist/auditoria-cv/
          (cd dist && zip -qr "auditoria-cv-${GITHUB_REF_NAME}.skill" auditoria-cv)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/auditoria-cv-${GITHUB_REF_NAME}.skill" \
            --title "$GITHUB_REF_NAME" --generate-notes
